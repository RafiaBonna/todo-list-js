<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Princess's Magical Diary1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <!-- Magic Crown & Title -->
        <header>
            <div class="crown-icon">👑</div>
            <h1>My Magical Diary</h1>
            <p class="subtitle">✨ Writing down my royal dreams & tasks ✨</p>
        </header>

        <!-- Input Area -->
        <div class="todo-input-box">
            <input type="text" id="todo-input" placeholder="🌸 Write a new wish or task...">
            <button id="add-btn">Add ✨</button>
        </div>

        <!-- Dynamic Tasks List -->
        <ul id="todo-list">
            <!-- JavaScript will inject tasks here -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
